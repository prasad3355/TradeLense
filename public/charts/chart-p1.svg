<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <rect width="320" height="160" fill="#0E0E14"/>
  <!-- Grid lines -->
  <line x1="0" y1="40" x2="320" y2="40" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="80" x2="320" y2="80" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1A1A24" stroke-width="1"/>
  <line x1="64" y1="0" x2="64" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="128" y1="0" x2="128" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="192" y1="0" x2="192" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <!-- Breakout pattern — XAUUSD London, bullish surge then hold -->
  <!-- Candles left side consolidation -->
  <line x1="20" y1="115" x2="20" y2="90" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="15" y="100" width="10" height="12" rx="1" fill="#EF4444" opacity="0.7"/>
  <line x1="38" y1="112" x2="38" y2="88" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="33" y="100" width="10" height="10" rx="1" fill="#34D399" opacity="0.75"/>
  <line x1="56" y1="110" x2="56" y2="85" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="51" y="98" width="10" height="10" rx="1" fill="#EF4444" opacity="0.65"/>
  <line x1="74" y1="108" x2="74" y2="82" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="69" y="96" width="10" height="9" rx="1" fill="#34D399" opacity="0.7"/>
  <!-- Breakout surge -->
  <line x1="92" y1="100" x2="92" y2="50" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="87" y="55" width="10" height="40" rx="1" fill="#34D399" opacity="0.9"/>
  <line x1="110" y1="70" x2="110" y2="30" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="105" y="35" width="10" height="30" rx="1" fill="#34D399" opacity="0.95"/>
  <!-- Continuation -->
  <line x1="128" y1="55" x2="128" y2="25" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="123" y="28" width="10" height="24" rx="1" fill="#34D399" opacity="0.9"/>
  <line x1="146" y1="45" x2="146" y2="20" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="141" y="22" width="10" height="20" rx="1" fill="#34D399" opacity="0.85"/>
  <!-- Small pullback -->
  <line x1="164" y1="30" x2="164" y2="55" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="159" y="34" width="10" height="18" rx="1" fill="#EF4444" opacity="0.6"/>
  <!-- Resume -->
  <line x1="182" y1="25" x2="182" y2="48" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="177" y="28" width="10" height="17" rx="1" fill="#34D399" opacity="0.85"/>
  <line x1="200" y1="20" x2="200" y2="40" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="195" y="22" width="10" height="16" rx="1" fill="#34D399" opacity="0.9"/>
  <!-- Entry zone box -->
  <rect x="85" y="50" width="65" height="55" rx="3" fill="#34D399" opacity="0.04" stroke="#34D399" stroke-width="0.6" stroke-opacity="0.3"/>
  <!-- Equity curve -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M 10 105 C 40 100, 70 92, 92 70 S 115 38, 140 28 S 175 22, 210 18" fill="none" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow1)"/>
  <circle cx="210" cy="18" r="3.5" fill="#34D399" opacity="0.9"/>
  <circle cx="210" cy="18" r="6" fill="#34D399" opacity="0.15"/>
  <!-- Label -->
  <text x="10" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399" opacity="0.6">XAUUSD · LONG · M15</text>
  <text x="240" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399" opacity="0.5">+2.4R</text>
</svg>
