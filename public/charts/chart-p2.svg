<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <rect width="320" height="160" fill="#0E0E14"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="320" y2="40" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="80" x2="320" y2="80" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1A1A24" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <!-- EURUSD Order Block Pullback — SHORT, distribution after rejection -->
  <!-- Upswing candles -->
  <line x1="15" y1="110" x2="15" y2="75" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="10" y="80" width="10" height="28" rx="1" fill="#34D399" opacity="0.7"/>
  <line x1="33" y1="88" x2="33" y2="55" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="28" y="60" width="10" height="26" rx="1" fill="#34D399" opacity="0.75"/>
  <line x1="51" y1="72" x2="51" y2="40" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="46" y="44" width="10" height="26" rx="1" fill="#34D399" opacity="0.8"/>
  <!-- Rejection wick + doji -->
  <line x1="69" y1="28" x2="69" y2="62" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="64" y="42" width="10" height="14" rx="1" fill="#EF4444" opacity="0.8"/>
  <!-- Distribution / waterfall -->
  <line x1="87" y1="42" x2="87" y2="72" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="82" y="48" width="10" height="20" rx="1" fill="#EF4444" opacity="0.85"/>
  <line x1="105" y1="55" x2="105" y2="88" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="100" y="60" width="10" height="24" rx="1" fill="#EF4444" opacity="0.9"/>
  <line x1="123" y1="70" x2="123" y2="100" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="118" y="75" width="10" height="22" rx="1" fill="#EF4444" opacity="0.85"/>
  <!-- Small bounce -->
  <line x1="141" y1="88" x2="141" y2="108" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="136" y="92" width="10" height="14" rx="1" fill="#34D399" opacity="0.5"/>
  <!-- Continue down -->
  <line x1="159" y1="95" x2="159" y2="118" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="154" y="98" width="10" height="18" rx="1" fill="#EF4444" opacity="0.8"/>
  <line x1="177" y1="100" x2="177" y2="122" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="172" y="104" width="10" height="16" rx="1" fill="#EF4444" opacity="0.75"/>
  <!-- Order block zone -->
  <rect x="62" y="28" width="50" height="30" rx="3" fill="#EF4444" opacity="0.04" stroke="#EF4444" stroke-width="0.6" stroke-opacity="0.3"/>
  <!-- Equity curve — inverted for short profit -->
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Short trade equity grows as price falls -->
  <path d="M 60 42 C 80 55, 100 75, 120 90 S 155 108, 185 115" fill="none" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow2)"/>
  <circle cx="185" cy="115" r="3.5" fill="#EF4444" opacity="0.9"/>
  <circle cx="185" cy="115" r="6" fill="#EF4444" opacity="0.15"/>
  <text x="10" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" opacity="0.6">EURUSD · SHORT · H1</text>
  <text x="230" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" opacity="0.5">-1.0R</text>
</svg>
