  <line x1="162" y1="10" x2="162" y2="22" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="157" y="12" width="10" height="8" rx="1" fill="#34D399" opacity="0.85"/>
  <defs>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9"/>
