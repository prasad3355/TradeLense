  <!-- FVG zone -->
  <rect x="42" y="50" width="50" height="28" rx="2" fill="#8B5CF6" opacity="0.07" stroke="#8B5CF6" stroke-width="0.7" stroke-opacity="0.35" stroke-dasharray="3,2"/>
  <text x="44" y="62" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8B5CF6" opacity="0.5">FVG</text>
  <!-- Price fills into FVG then launches -->
