  <rect x="43" y="64" width="10" height="20" rx="1" fill="#EF4444" opacity="0.6"/>
  <line x1="64" y1="58" x2="64" y2="78" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="59" y="62" width="10" height="14" rx="1" fill="#EF4444" opacity="0.55"/>
  <!-- Entry + reversal -->
  <line x1="82" y1="50" x2="82" y2="78" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="77" y="54" width="10" height="20" rx="1" fill="#34D399" opacity="0.82"/>
  <line x1="98" y1="40" x2="98" y2="60" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="93" y="43" width="10" height="15" rx="1" fill="#34D399" opacity="0.88"/>
  <line x1="114" y1="28" x2="114" y2="46" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="109" y="31" width="10" height="13" rx="1" fill="#34D399" opacity="0.9"/>
  <line x1="130" y1="18" x2="130" y2="34" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="125" y="20" width="10" height="12" rx="1" fill="#34D399" opacity="0.92"/>
  <line x1="146" y1="12" x2="146" y2="26" stroke="#4a4a60" stroke-width="1.2"/>
