  <rect x="5" y="76" width="10" height="22" rx="1" fill="#34D399" opacity="0.65"/>
  <line x1="26" y1="82" x2="26" y2="55" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="21" y="60" width="10" height="20" rx="1" fill="#34D399" opacity="0.7"/>
  <line x1="42" y1="62" x2="42" y2="38" stroke="#4a4a60" stroke-width="1.2"/>
