  <text x="10" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" opacity="0.6">NAS100 · SHORT · M15</text>
  <text x="225" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" opacity="0.5">-1.2R</text>
