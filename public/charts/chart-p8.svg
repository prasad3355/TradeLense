  <text x="205" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F59E0B" opacity="0.45">OB Level</text>
  <defs>
    <linearGradient id="g8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Short profit as price falls -->
  <path d="M 74 20 C 88 35, 106 52, 126 68 S 150 82, 170 92" fill="none" stroke="url(#g8)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow8)"/>
