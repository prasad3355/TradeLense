  <rect x="119" y="62" width="10" height="20" rx="1" fill="#EF4444" opacity="0.9"/>
  <line x1="140" y1="68" x2="140" y2="94" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="135" y="72" width="10" height="18" rx="1" fill="#EF4444" opacity="0.85"/>
  <line x1="156" y1="76" x2="156" y2="100" stroke="#4a4a60" stroke-width="1.2"/>
