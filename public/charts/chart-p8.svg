  <line x1="58" y1="45" x2="58" y2="24" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="53" y="28" width="10" height="15" rx="1" fill="#34D399" opacity="0.7"/>
  <!-- Exhaustion doji -->
  <line x1="76" y1="18" x2="76" y2="42" stroke="#8B99CC" stroke-width="1.5"/>
  <rect x="71" y="24" width="10" height="12" rx="1" fill="#EF4444" opacity="0.7"/>
  <!-- Reversal flush -->
  <line x1="92" y1="30" x2="92" y2="58" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="87" y="34" width="10" height="20" rx="1" fill="#EF4444" opacity="0.82"/>
  <line x1="108" y1="45" x2="108" y2="74" stroke="#4a4a60" stroke-width="1.2"/>
