<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <rect width="320" height="160" fill="#0E0E14"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="320" y2="40" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="80" x2="320" y2="80" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1A1A24" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <!-- BTCUSD Trendline Break — failed attempt (loss) -->
  <!-- Descending channel -->
  <line x1="10" y1="30" x2="10" y2="58" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="5" y="34" width="10" height="20" rx="1" fill="#EF4444" opacity="0.7"/>
  <line x1="26" y1="40" x2="26" y2="68" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="21" y="44" width="10" height="20" rx="1" fill="#EF4444" opacity="0.7"/>
  <line x1="42" y1="52" x2="42" y2="78" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="37" y="56" width="10" height="18" rx="1" fill="#EF4444" opacity="0.65"/>
  <line x1="58" y1="62" x2="58" y2="88" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="53" y="66" width="10" height="18" rx="1" fill="#EF4444" opacity="0.65"/>
  <!-- Trendline break attempt -->
  <line x1="78" y1="60" x2="78" y2="38" stroke="#60c0ff" stroke-width="1.5"/>
  <rect x="73" y="42" width="10" height="16" rx="1" fill="#34D399" opacity="0.8"/>
  <line x1="94" y1="44" x2="94" y2="28" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="89" y="30" width="10" height="12" rx="1" fill="#34D399" opacity="0.75"/>
  <!-- Failure — re-break -->
  <line x1="110" y1="34" x2="110" y2="58" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="105" y="38" width="10" height="18" rx="1" fill="#EF4444" opacity="0.85"/>
  <line x1="126" y1="48" x2="126" y2="74" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="121" y="52" width="10" height="18" rx="1" fill="#EF4444" opacity="0.9"/>
  <line x1="142" y1="60" x2="142" y2="85" stroke="#4a4a60" stroke-width="1.2"/>
  <rect x="137" y="64" width="10" height="18" rx="1" fill="#EF4444" opacity="0.85"/>
  <!-- Descending trendline -->
  <line x1="8" y1="28" x2="200" y2="95" stroke="#60c0ff" stroke-dasharray="5,4" stroke-width="0.9" stroke-opacity="0.35"/>
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#60c0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Equity flat then falls on loss -->
  <path d="M 8 80 C 40 75, 65 58, 82 50 S 100 44, 115 50 S 135 65, 158 78" fill="none" stroke="url(#g5)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow5)"/>
  <circle cx="158" cy="78" r="3.5" fill="#EF4444" opacity="0.85"/>
  <circle cx="158" cy="78" r="6" fill="#EF4444" opacity="0.12"/>
  <text x="10" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" opacity="0.6">BTCUSD · LONG · D1</text>
  <text x="225" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" opacity="0.5">-0.8R</text>
</svg>
